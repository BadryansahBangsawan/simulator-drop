name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  # Build macOS app and zip it
  build:
    name: Build macOS App
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app
        run: bash package-app.sh

      - name: Zip app
        run: |
          APP=$(ls -d dist/*.app)
          BASE=$(basename "$APP" .app)
          ditto -c -k --keepParent "$APP" "dist/$BASE.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/*.zip
          if-no-files-found: error

  # Release only on v* tags
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: List release assets
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body: |
            ## Simulator Drop ${{ github.ref_name }}

            macOS menu bar app — lives in the menu bar, no Dock icon.

            ---

            ### Download

            | Platform | File |
            |---|---|
            | **macOS** (Apple Silicon & Intel, macOS 14+) | `SimulatorDrop-*-macos.zip` |

            ---

            ### Installation

            Homebrew:
            ```bash
            brew tap BadryansahBangsawan/mac-menu-apps
            brew upgrade --cask simulator-drop
            # or for a fresh install:
            brew install --cask simulator-drop
            ```

            Manual: Download the zip, unzip, drag to Applications.

            macOS may block the app on first open (ad-hoc signed build). Run once:
            ```bash
            xattr -cr /Applications/SimulatorDrop.app && open /Applications/SimulatorDrop.app
            ```
            Or right-click the app, Open, then Open again. Still blocked? System Settings → Privacy & Security → Open Anyway.

            ---

            > Full changelog auto-generated below
          append_body: true
          files: |
            dist/*.zip
